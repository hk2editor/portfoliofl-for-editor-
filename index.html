<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Editor Portfolio</title>

<style>

body {
  margin: 0;
  font-family: sans-serif;
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
}

/* HERO */
.hero {
  text-align: center;
  padding: 60px 20px;
}

.hero h1 {
  font-size: 32px;
}

.hero span {
  color: #22c55e;
}

.hero p {
  color: #94a3b8;
}

.btn {
  margin-top: 15px;
  padding: 12px 25px;
  background: #22c55e;
  border: none;
  border-radius: 30px;
  color: black;
  font-weight: bold;
}

/* REELS STYLE PORTFOLIO */
.reels {
  display: flex;
  overflow-x: auto;
  gap: 15px;
  padding: 20px;
}

.reel {
  min-width: 200px;
  background: #1e293b;
  border-radius: 15px;
  overflow: hidden;
}

.reel video {
  width: 100%;
}

/* SERVICES */
.services {
  padding: 30px 20px;
}

.service {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
}

/* SKILLS */
.skills {
  padding: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.skill {
  background: #22c55e;
  color: black;
  padding: 8px 15px;
  border-radius: 20px;
}

/* CONTACT */
.contact {
  text-align: center;
  padding: 40px 20px;
}

footer {
  text-align: center;
  padding: 15px;
  background: black;
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>I Edit <span>Viral Reels</span></h1>
  <p>Short form content that gets views, likes & followers</p>
  <button class="btn">Hire Me</button>
</div>

<!-- PORTFOLIO (REELS STYLE) -->
<div class="reels">

  <div class="reel">
    <video src="reel1.mp4" controls></video>
  </div>

  <div class="reel">
    <video src="reel2.mp4" controls></video>
  </div>

  <div class="reel">
    <video src="reel3.mp4" controls></video>
  </div>

</div>

<!-- SERVICES -->
<div class="services">
  <h2>Services</h2>

  <div class="service">🔥 Viral Reels Editing</div>
  <div class="service">🎬 YouTube Shorts</div>
  <div class="service">🎧 Beat Sync + Subtitles</div>
  <div class="service">🎨 Color Grading</div>

</div>

<!-- SKILLS -->
<div class="skills">
  <div class="skill">CapCut</div>
  <div class="skill">Alight Motion</div>
  <div class="skill">VN Editor</div>
  <div class="skill">Beat Sync</div>
</div>

<!-- CONTACT -->
<div class="contact">
  <h2>Work With Me</h2>
  <p>DM me for viral edits</p>
  <button class="btn">WhatsApp Me</button>
</div>

<footer>
  © 2026 Mobile Editor Portfolio
</footer>

</body>
</html>
